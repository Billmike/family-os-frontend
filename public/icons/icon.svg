<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <!-- Subtle inner shadow to add depth -->
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="in" result="shadow"/>
      <feColorMatrix in="shadow" type="matrix"
        values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.5  0 0 0 0.25 0" result="coloredShadow"/>
      <feMerge><feMergeNode in="coloredShadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background (iOS/standard style, ~22% corner radius) -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>

  <!-- House silhouette: one filled pentagon (roof + walls as a single shape) -->
  <!-- Peak (256,118) → right eave (418,262) → right base (418,394) → left base (94,394) → left eave (94,262) -->
  <path
    d="M256,118 L418,262 L418,394 L94,394 L94,262 Z"
    fill="white" opacity="0.96"/>

  <!-- Door: centred, indigo fill creates a clean cutout -->
  <rect x="210" y="294" width="92" height="100" rx="14" fill="url(#bg)"/>

  <!-- Chimney: sits on the right roof slope, above the eave line -->
  <rect x="318" y="172" width="38" height="80" rx="10" fill="white" opacity="0.96"/>
</svg>
